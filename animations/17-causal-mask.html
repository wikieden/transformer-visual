<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>因果 mask</title><link rel="stylesheet" href="anim.css">
<style>svg text.big{font-size:15px}svg text.cap{font-size:15px;font-weight:500}svg text.cell{font-size:14px}</style></head>
<body><main>
<h1>第 17 章 · 因果 mask：不许偷看后面的词</h1>
<p class="sub">配套讲义：<a href="../lessons/17-causal-mask.html">第 17 章 · 因果 mask：不许偷看后面的词</a>。"狗咬人"三个词，分数表的行 = 谁去找，列 = 被找的。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 400"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="fill">自己拖：M 里要遮的格子填多少</label><input type="range" id="fill" min="-21" max="0" step="1" value="0"><span id="fillv">0</span></div>
<p class="note">看点：① 不加 mask 时，"咬"把大部分注意力给了它要猜的"人"；② mask 表能看填 0、要遮填 −∞，加到分数上再做 softmax，被遮的格子权重正好是 0；③ 最后一段把要遮的格子从 0 往负数调：−10 还剩一丁点，只有 −∞ 才正好是 0。滑块拖到最左边就是 −∞。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
const W=['狗','咬','人'];
const S=[[3,2,1],[2,1,3],[1,2,2]];
const NINF=-Infinity;
const fmtN=v=>v===NINF?'−∞':(Math.round(v*100)/100).toString().replace('-','−');
const fmtW=v=>{if(v===0)return '0';if(v<0.005){const d=-Math.floor(Math.log10(v));return Number(v.toPrecision(1)).toFixed(d)}return v.toFixed(2)};  // 小数照写，不用科学计数法
const blocked=(i,j)=>j>i;
const M=v=>S.map((r,i)=>r.map((_,j)=>blocked(i,j)?v:0));
const add=(A,B)=>A.map((r,i)=>r.map((x,j)=>x+B[i][j]));
const ex=A=>A.map(r=>r.map(x=>Math.exp(x)));
const soft=A=>ex(A).map(r=>{const t=r.reduce((a,b)=>a+b,0);return r.map(x=>x/t)});
const FR=[
  {cap:'分数表 QKᵀ/√dₖ：每一行是一个词去看所有词的分数',L:'S'},
  {cap:'不加 mask 直接 softmax："咬"把 67% 的注意力给了它要猜的"人"',L:'S',R:'W0'},
  {cap:'mask 表 M：能看的格子填 0，要遮的格子（右上三角）填 −∞',L:'S',C:'M'},
  {cap:'分数 + M：能看的 +0 不变，要遮的变成 −∞',L:'SM',C:'M'},
  {cap:'套 eˣ：e 的 −∞ 次方正好是 0',L:'SM',C:'E'},
  {cap:'除以每行总和：被遮的格子权重正好是 0，每行仍加起来等于 1',L:'SM',C:'E',R:'W'},
  ...[0,-2,-5,-10,NINF].flatMap(v=>[0,1].map(()=>({cap:`M 里要遮的格子填 ${fmtN(v)}：看"咬"那一行，"人"还分到多少`,L:'SM',C:'M',R:'W',v,focus:true})))
];
let k=0,custom=null;
function table(x,title,A,opt={}){
  const cw=56,ch=34,y0=96;
  txt(title,{x:x+30+cw*1.5,y:66,'text-anchor':'middle',class:'big'},sv);
  W.forEach((w,j)=>txt(w,{x:x+30+cw*j+cw/2,y:88,'text-anchor':'middle',class:'m'},sv));
  A.forEach((r,i)=>{
    const t=txt(W[i],{x:x+18,y:y0+ch*i+22,'text-anchor':'middle',class:'m'},sv);
    if(opt.focus&&i===1)t.style.fill='var(--accent)';
    r.forEach((v,j)=>{
      const bx=x+30+cw*j,by=y0+ch*i,b=blocked(i,j);
      let fill='var(--bg)',stroke='var(--line)';
      if(opt.mark&&b){fill='var(--purple)';}
      if(opt.peek&&i===1&&j===2){stroke='var(--bad)'}
      const rc=el('rect',{x:bx+2,y:by+2,width:cw-4,height:ch-4,rx:5,fill,stroke,'stroke-width':opt.peek&&i===1&&j===2?2.5:1},sv);
      if(opt.mark&&b)rc.setAttribute('fill-opacity','.15');
      if(opt.focus&&i!==1)rc.setAttribute('opacity','.35');
      const s=typeof v==='string'?v:(opt.w?fmtW(v):fmtN(v));
      const tt=txt(s,{x:bx+cw/2,y:by+22,'text-anchor':'middle',class:'cell'},sv);
      if(s.length>5)tt.style.fontSize=s.length>7?'10px':'12px';  // 长小数缩小字号，免得出格
      if(opt.mark&&b)tt.style.fill='var(--purple)';
      if(opt.peek&&i===1&&j===2)tt.style.fill='var(--bad)';
      if(opt.focus&&i!==1)tt.setAttribute('opacity','.35');
    });
  });
}
function bars(row,label){
  const y=250,x0=150,bw=110,H=90;
  txt(label,{x:340,y:y-10,'text-anchor':'middle',class:'big'},sv);
  el('line',{x1:x0-20,y1:y+H,x2:x0+3*bw+10,y2:y+H,stroke:'var(--line)'},sv);
  row.forEach((p,j)=>{
    const h=Math.max(p*H,p>0?1.5:0),bx=x0+j*bw;
    const col=j===2?'var(--bad)':'var(--teal)';
    el('rect',{x:bx,y:y+H-h,width:70,height:h,rx:4,fill:col,'fill-opacity':.75},sv);
    txt(`看${W[j]}`,{x:bx+35,y:y+H+18,'text-anchor':'middle',class:'m'},sv);
    const t=txt(p===0?'正好 0':(p<0.005?fmtW(p):(p*100).toFixed(p<0.1?1:0)+'%'),{x:bx+35,y:y+H-h-6,'text-anchor':'middle',class:'big'},sv);
    t.style.fill=col;
  });
}
function draw(){
  clear(sv);
  const f=custom!==null?{cap:`M 里要遮的格子填 ${fmtN(custom)}`,L:'SM',C:'M',R:'W',v:custom,focus:true}:FR[k];
  const v=f.v===undefined?NINF:f.v;
  txt(f.cap,{x:340,y:26,'text-anchor':'middle',class:'cap'},sv);
  const SM=add(S,M(v));
  table(10,f.L==='S'?'分数':'分数 + M',f.L==='S'?S:SM,{mark:f.L==='SM',peek:f.R==='W0',focus:f.focus});
  if(f.C==='M')table(240,'M',M(v),{mark:true,focus:f.focus});
  if(f.C==='E')table(240,'eˣ',ex(SM),{mark:true,w:true});
  if(f.R)table(470,'权重（softmax）',f.R==='W0'?soft(S):soft(SM),{w:true,mark:f.R==='W',peek:f.R==='W0',focus:f.focus});
  if(f.R==='W0')bars(soft(S)[1],'"咬"那一行：不加 mask');
  else if(f.R==='W')bars(soft(SM)[1],f.focus?`"咬"那一行：遮的格子填 ${fmtN(v)}`:'"咬"那一行：加了 mask');
}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=FR.length-1)return false;k++;draw();return true}
$('fill').oninput=e=>{ANIM.stop();const v=+e.target.value;custom=v<=-21?NINF:v;$('fillv').textContent=fmtN(custom);draw()};
setupPlayer({captureSeed:1,reset,next},1500);
</script></body></html>
