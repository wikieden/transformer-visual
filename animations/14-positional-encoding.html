<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>号码牌位置编码</title><link rel="stylesheet" href="anim.css">
<style>svg text.big{font-size:17px}svg text.cap{font-size:15px;font-weight:500}svg text.eq{font-size:20px}</style></head>
<body><main>
<h1>第 14 章 · 位置编码：给座位发号码牌</h1>
<p class="sub">配套讲义：<a href="../lessons/14-positional-encoding.html">第 14 章 · 位置编码 positional encoding</a>。"狗咬人"和"人咬狗"用同样三个词，只是座位不同。</p>
<div class="panel"><svg id="sv" viewBox="0 0 680 340"></svg></div>
<div class="row"><button id="play">▶ 播放</button><button id="step">→ 单步</button><button id="reset">↺ 从头开始</button></div>
<div class="row"><label for="seat">自己拖："狗"坐几号座</label><input type="range" id="seat" min="1" max="1000" value="1"><span id="seatv">1</span></div>
<p class="note">看点：① 不戴号码牌时，两句话里每个词的分数完全一样，结果也一样；② 号码牌属于座位，谁坐上来谁加上它，同一个词在不同座位上向量就不同了；③ 牌上的数一直往上加，座位号一大，就把词本身盖住了。</p>
</main>
<script src="anim.js"></script>
<script>
const sv=$('sv');
const W={'狗':[2,0],'咬':[0,1],'人':[1,0]};
const S=[{name:'狗咬人',w:['狗','咬','人']},{name:'人咬狗',w:['人','咬','狗']}];
const P=[[0,1],[0,2],[0,3]];
const SEATS=[1,3,10,30,100,300,1000];
const CAP=['两句话，同样三个词，只是坐的座位不同',
  '不戴号码牌：咬 给每个词打分，分数只看是哪个词',
  '加起来的结果一模一样 → attention 分不出谁咬谁',
  '每个座位放一块号码牌：牌属于座位，不属于词',
  "谁坐上来，谁就把牌加到自己身上：x′ = x + p",
  '同一个狗：分数 4 变 8；同一个人：7 变 3',
  '分数不同 → 比例不同 → 结果不同，顺序分出来了'];
const N=CAP.length+SEATS.length;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1],fmt=v=>`[${v[0]}, ${v[1]}]`;
let k=0,custom=null;
function sentences(){
  txt(CAP[k],{x:340,y:24,'text-anchor':'middle',class:'cap'},sv);
  const plated=k>=4,Q0=[1,0],q=plated?add(Q0,P[1]):Q0;  // 咬 的 q 本身是 [1,0]（k 是 [0,1]），同讲义第二、三步
  S.forEach((s,si)=>{
    const ox=20+si*340;
    txt(s.name,{x:ox+150,y:62,'text-anchor':'middle',class:'big'},sv);
    s.w.forEach((w,i)=>{
      const x=ox+i*103,cx=x+47,v=plated?add(W[w],P[i]):W[w];
      txt(`${i+1} 号座`,{x:cx,y:88,'text-anchor':'middle',class:'m'},sv);
      el('rect',{x,y:96,width:94,height:56,rx:8,fill:'var(--bg)',stroke:plated?'var(--accent)':'var(--line)'},sv);
      txt(w,{x:cx,y:120,'text-anchor':'middle',class:'big'},sv);
      txt(fmt(v),{x:cx,y:143,'text-anchor':'middle',fill:plated?'var(--accent)':'var(--text)'},sv).style.fill=plated?'var(--accent)':'';
      if(k>=3){
        el('rect',{x:x+10,y:162,width:74,height:26,rx:6,fill:'var(--amber)','fill-opacity':.15,stroke:'var(--amber)'},sv);
        txt((plated?'+ ':'牌 ')+fmt(P[i]),{x:cx,y:180,'text-anchor':'middle'},sv);
      }
      if((k>=1&&k<3)||k>=5){
        const sc=dot(q,v),t=txt(`分数 ${sc}`,{x:cx,y:220,'text-anchor':'middle',class:'big'},sv);
        if(k>=5&&w!=='咬')t.style.fill=w==='狗'?'var(--warm)':'var(--teal)';
      }
    });
    if(k>=1)txt(`咬 的 q = ${fmt(q)}`,{x:ox+150,y:250,'text-anchor':'middle',class:'m'},sv);
    if(k===2)txt('结果 [6.83, 2.63]',{x:ox+150,y:282,'text-anchor':'middle',class:'big'},sv);
  });
  if(k===2)txt('一模一样',{x:340,y:318,'text-anchor':'middle',class:'cap'},sv).style.fill='var(--bad)';
  if(k>=6)txt('两边分数不同',{x:340,y:300,'text-anchor':'middle',class:'cap'},sv).style.fill='var(--good)';
}
function bar(n){
  txt(n>=1000?'词被盖住了 → 号码牌要保持在小范围（第 15 章：sin、cos）':'号码牌一直往上加：座位号越大，牌越大',{x:340,y:24,'text-anchor':'middle',class:'cap'},sv);
  txt(`"狗"坐到 ${n} 号座`,{x:340,y:70,'text-anchor':'middle',class:'big'},sv);
  txt(`[2, 0] + [0, ${n}] = [2, ${n}]`,{x:340,y:110,'text-anchor':'middle',class:'eq'},sv);
  const X=40,L=600,wd=Math.max(L*2/(2+n),1.5);
  el('rect',{x:X,y:140,width:L,height:44,rx:6,fill:'var(--amber)','fill-opacity':.55},sv);
  el('rect',{x:X,y:140,width:wd,height:44,rx:wd>12?6:0,fill:'var(--teal)'},sv);
  txt('■ 词本身：2',{x:X,y:212},sv).style.fill='var(--teal)';
  txt(`■ 号码牌：${n}`,{x:X+L,y:212,'text-anchor':'end'},sv).style.fill='var(--amber)';
  const pct=200/(2+n);
  txt(`这个向量里，"是哪个词"只占 ${pct>=10?pct.toFixed(0):pct.toFixed(1)}%`,{x:340,y:258,'text-anchor':'middle',class:'big'},sv);
  txt('（条的长度按两部分数的大小画）',{x:340,y:284,'text-anchor':'middle',class:'m'},sv);
}
function draw(){clear(sv);if(custom!==null)bar(custom);else if(k<CAP.length)sentences();else bar(SEATS[k-CAP.length])}
function reset(){k=0;custom=null;draw()}
function next(){if(custom!==null){custom=null;draw();return true}if(k>=N-1)return false;k++;draw();return true}
$('seat').oninput=e=>{ANIM.stop();custom=+e.target.value;$('seatv').textContent=custom;draw()};
setupPlayer({captureSeed:1,reset,next},1600);
</script></body></html>
